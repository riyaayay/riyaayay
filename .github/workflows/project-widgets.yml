# Save this file as: .github/workflows/profile-widgets.yml
# in your riyaayay/riyaayay repo (the one your profile README lives in).
#
# It regenerates two animated images once a day (and whenever you trigger
# it manually from the Actions tab):
#   1. a snake that eats through your contribution graph
#   2. a rotating 3D bar chart of your contribution calendar
#
# After adding this file:
#   1. Go to the "Actions" tab on riyaayay/riyaayay and enable workflows
#      if prompted.
#   2. Open "Profile Widgets" in the Actions list and click "Run workflow"
#      once, manually, to generate the images for the first time.
#   3. Give it a minute, then refresh your profile page.
#
# No secrets need to be added — the built-in GITHUB_TOKEN is enough for
# public contributions.

name: Profile Widgets

on:
  schedule:
    - cron: "0 18 * * *"  # once a day
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - name: push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          git commit -m "update 3d contribution calendar" || echo "nothing to commit"
          git push
