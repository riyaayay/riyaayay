<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
  <title id="title">Riya's systems orbit</title>
  <desc id="desc">A pastel isometric scene of research, build, verify, and ship orbiting a central AI systems cube.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff9fb"/>
      <stop offset=".45" stop-color="#f1effb"/>
      <stop offset="1" stop-color="#e6f7ef"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e6e6fa"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c1f0db"/><stop offset="1" stop-color="#a9dac5"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8e0f5"/><stop offset="1" stop-color="#a3cce3"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="19" stdDeviation="14" flood-color="#8d7da8" flood-opacity=".2"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2" fill="#9c89b8" opacity=".16"/></pattern>
  </defs>
  <rect x="9" y="9" width="1422" height="632" rx="42" fill="url(#sky)" stroke="#e6e6fa" stroke-width="2"/>
  <rect x="9" y="9" width="1422" height="632" rx="42" fill="url(#dots)"/>
  <ellipse cx="720" cy="492" rx="332" ry="69" fill="#9c89b8" opacity=".14" filter="url(#soft)"/>
  <g fill="none" stroke="#9c89b8" stroke-width="2" stroke-dasharray="8 12" opacity=".5">
    <animateTransform attributeName="transform" type="rotate" from="0 720 339" to="360 720 339" dur="24s" repeatCount="indefinite"/>
    <ellipse cx="720" cy="339" rx="488" ry="180"/>
    <ellipse cx="720" cy="339" rx="353" ry="128"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M650 269 720 229 790 269 720 310Z" fill="url(#top)"/>
    <path d="M650 269 720 310 720 396 650 356Z" fill="url(#left)"/>
    <path d="M790 269 720 310 720 396 790 356Z" fill="url(#right)"/>
    <path d="m681 286 39 22 39-22" fill="none" stroke="#9c89b8" stroke-width="2" opacity=".45"/>
    <text x="720" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="45" font-weight="700" fill="#5e5570">R</text>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(264 243)">
      <path d="M0 22 48 0 96 22 48 44Z" fill="#fff"/><path d="M0 22 48 44v42L0 64Z" fill="#fadDE1"/><path d="M96 22 48 44v42l48-22Z" fill="#f1b9c1"/>
      <text x="48" y="116" font-size="15" font-weight="700" fill="#5e5570" letter-spacing="2">RESEARCH</text>
      <text x="48" y="139" font-size="13" fill="#7b728b">ask better questions</text>
    </g>
    <g transform="translate(431 429)">
      <path d="M0 22 48 0 96 22 48 44Z" fill="#fff"/><path d="M0 22 48 44v42L0 64Z" fill="#c1f0db"/><path d="M96 22 48 44v42l48-22Z" fill="#9bd9bd"/>
      <text x="48" y="116" font-size="15" font-weight="700" fill="#5e5570" letter-spacing="2">BUILD</text>
      <text x="48" y="139" font-size="13" fill="#7b728b">make it real</text>
    </g>
    <g transform="translate(912 429)">
      <path d="M0 22 48 0 96 22 48 44Z" fill="#fff"/><path d="M0 22 48 44v42L0 64Z" fill="#e6e6fa"/><path d="M96 22 48 44v42l48-22Z" fill="#c9c6ec"/>
      <text x="48" y="116" font-size="15" font-weight="700" fill="#5e5570" letter-spacing="2">VERIFY</text>
      <text x="48" y="139" font-size="13" fill="#7b728b">earn confidence</text>
    </g>
    <g transform="translate(1080 243)">
      <path d="M0 22 48 0 96 22 48 44Z" fill="#fff"/><path d="M0 22 48 44v42L0 64Z" fill="#b8e0f5"/><path d="M96 22 48 44v42l48-22Z" fill="#94c9e4"/>
      <text x="48" y="116" font-size="15" font-weight="700" fill="#5e5570" letter-spacing="2">SHIP</text>
      <text x="48" y="139" font-size="13" fill="#7b728b">move with care</text>
